- type: particleEffect
  id: RMCWeldingSparks
  sprite:
    sprite: _RMC14/Particles/generic.rsi
    state: curl
  shader: unshaded
  colorOverLifetime:
    - time: 0.0
      color: "#FFFFFFFF"
    - time: 0.1
      color: "#FFEE88FF"
    - time: 0.5
      color: "#FF8800BB"
    - time: 1.0
      color: "#FF220000"
  lifetime: 0.3
  lifetimeVariance: 0.25
  speed: 2.5
  speedVariance: 1.5
  particleSize: 0.8
  stretchFactor: 0.5
