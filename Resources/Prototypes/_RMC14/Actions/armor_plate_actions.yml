- type: entity
  id: RMCActionEmergencyInjectorInject
  name: Inject Emergency Plate
  description: Trigger the emergency-injector plate, injecting its chemical cocktail.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _RMC14/Objects/Armor/Plates/research_plate.rsi
      state: plate_research
    useDelay: 1
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RMCEmergencyInjectorInjectActionEvent

- type: entity
  id: RMCActionEmergencyInjectorToggleOverdose
  name: Toggle Overdose Protection
  description: Cycle the emergency-injector plate's overdose protection between Dynamic, Off, and Strict.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _RMC14/Objects/Armor/Plates/research_plate.rsi
      state: plate_research
    useDelay: 0.5
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:RMCEmergencyInjectorToggleOverdoseActionEvent
