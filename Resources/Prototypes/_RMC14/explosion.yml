- type: explosion
  id: RMC
  powerPerIntensity: 10
  particles: RMCExplosionParticlesDefault
  damagePerIntensity:
    types:
      Blunt: 5
      Heat: 5
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/_RMC14/Effects/grenade_smoke.rsi
  coreTexturePath: /Textures/_RMC14/Effects/smoke.rsi
  sparkTexturePath: /Textures/_RMC14/Objects/Weapons/shrapnel.rsi
  sparkStates: [ shrapnel_bright1, shrapnel_bright2 ]
  bigSound:
    collection: RMCExplosionBig
    params:
      volume: -3
  fireStates: 1
  sound:
    collection: CMExplosion
    params:
      volume: -3
  smallSound:
    collection: CMExplosion
    params:
      volume: -3


