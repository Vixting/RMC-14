    sprite: _RMC14/Objects/Devices/plant_analyzer.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/plant_analyzer.rsi
  - type: RMCPlantAnalyzer
  - type: UserInterface
    interfaces:
      enum.RMCPlantAnalyzerUiKey.Key:
        type: RMCPlantAnalyzerBui
  - type: Tag
    tags:
    - PlantAnalyzer
  - type: UseDelay
    delay: 0.5
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 200
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
