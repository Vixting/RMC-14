- type: entity
  abstract: true
  id: RMCFallingOrdnanceBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
  - type: RMCSpriteDescent
    startOffset: 0, 15
    duration: 1
  - type: ParticleEmitter
    effect: RMCFallingOrdnanceTrail
  - type: TimedDespawn
    lifetime: 1

# Mortar

- type: entity
  abstract: true
  parent: RMCFallingOrdnanceBase
  id: RMCMortarShellFallingBase
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_he
    rotation: 180
  - type: RMCSpriteDescent
    startOffset: 0, 10
    duration: 0.8
  - type: TimedDespawn
    lifetime: 0.8

- type: entity
  parent: RMCMortarShellFallingBase
  id: RMCMortarShellFallingHE

- type: entity
  parent: RMCMortarShellFallingBase
  id: RMCMortarShellFallingIncendiary
  components:
  - type: Sprite
    state: mortar_ammo_inc

